<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Financeiro{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        :root {
            --financeiro-receita: #1f5fbf;
            --financeiro-despesa: #b73a32;
            --financeiro-transferencia: #b56a19;
            --financeiro-quitado: #2f855a;
            --financeiro-aberto: #8a5a10;
            --financeiro-cancelado: #6b7280;
            --financeiro-zebra: #fbfcfe;
            --financeiro-border: #dbdbdb;
            --financeiro-soft: #fafafa;
            --financeiro-print-text: #111827;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .financeiro-hero {
            border: 1px solid var(--financeiro-border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            background: var(--financeiro-soft);
        }

        .help.is-danger {
            display: block;
            margin-top: 0.35rem;
        }

        .actions-cell {
            white-space: nowrap;
        }

        .filters-box {
            margin-bottom: 1.25rem;
            padding: 1rem;
            border: 1px solid var(--financeiro-border);
            border-radius: 0.75rem;
            background: var(--financeiro-soft);
        }

        .financeiro-autocomplete {
            position: relative;
        }

        .financeiro-autocomplete-menu {
            position: absolute;
            top: calc(100% + 0.25rem);
            left: 0;
            right: 0;
            z-index: 30;
            border: 1px solid var(--financeiro-border);
            border-radius: 0.5rem;
            background: #fff;
            box-shadow: 0 8px 20px rgba(10, 10, 10, 0.08);
            max-height: 16rem;
            overflow-y: auto;
        }

        .financeiro-autocomplete-menu[hidden] {
            display: none;
        }

        .financeiro-autocomplete-option {
            width: 100%;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 0.75rem 0.9rem;
            cursor: pointer;
        }

        .financeiro-autocomplete-option:hover,
        .financeiro-autocomplete-option:focus {
            background: #f5f5f5;
            outline: none;
        }

        .financeiro-autocomplete-empty {
            padding: 0.75rem 0.9rem;
            color: #7a7a7a;
        }

        .financeiro-table {
            font-size: 0.92rem;
        }

        .financeiro-table thead th {
            font-size: 0.74rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #5b6470;
            padding: 0.7rem 0.7rem;
            border-bottom-width: 1px;
        }

        .financeiro-table tbody td,
        .financeiro-table tfoot th,
        .financeiro-table tfoot td {
            padding: 0.7rem 0.7rem;
            vertical-align: top;
        }

        .financeiro-table tbody tr:nth-child(even) {
            background: var(--financeiro-zebra);
        }

        .financeiro-meta {
            display: block;
            margin-top: 0.2rem;
            font-size: 0.76rem;
            color: #6b7280;
            line-height: 1.35;
        }

        .tipo-badge,
        .status-badge,
        .valor-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            border-radius: 999px;
            padding: 0.18rem 0.55rem;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .tipo-badge.is-receita,
        .valor-chip.is-receita {
            color: var(--financeiro-receita);
            background: rgba(31, 95, 191, 0.09);
        }

        .tipo-badge.is-despesa,
        .valor-chip.is-despesa {
            color: var(--financeiro-despesa);
            background: rgba(183, 58, 50, 0.1);
        }

        .tipo-badge.is-transferencia,
        .valor-chip.is-transferencia {
            color: var(--financeiro-transferencia);
            background: rgba(181, 106, 25, 0.14);
        }

        .status-badge.is-quitado {
            color: var(--financeiro-quitado);
            background: rgba(47, 133, 90, 0.1);
        }

        .status-badge.is-aberto {
            color: var(--financeiro-aberto);
            background: rgba(138, 90, 16, 0.12);
        }

        .status-badge.is-cancelado {
            color: var(--financeiro-cancelado);
            background: rgba(107, 114, 128, 0.12);
        }

        .is-unsettled {
            font-weight: 700;
        }

        .is-opening-balance td {
            color: #4b5563;
            background: #f5f7fa;
        }

        .table-caption {
            margin-bottom: 0.75rem;
            color: #6b7280;
            font-size: 0.84rem;
        }

        .financeiro-report-block {
            margin-bottom: 1rem;
            border: 1px solid var(--financeiro-border);
            border-radius: 0.85rem;
            background: #fff;
            overflow: hidden;
        }

        .financeiro-report-header {
            padding: 0.9rem 1rem;
            background: var(--financeiro-soft);
            border-bottom: 1px solid var(--financeiro-border);
        }

        .financeiro-report-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #243041;
        }

        .financeiro-report-body {
            padding: 1rem;
        }

        .financeiro-total-line {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 0.75rem;
            margin-top: 0.75rem;
            border-top: 1px solid var(--financeiro-border);
            font-weight: 700;
        }

        .financeiro-kpi-grid {
            display: grid;
            gap: 0.9rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .financeiro-kpi {
            border: 1px solid var(--financeiro-border);
            border-radius: 0.75rem;
            background: #fff;
            padding: 1rem;
        }

        .financeiro-kpi-label {
            display: block;
            color: #6b7280;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.35rem;
        }

        .financeiro-kpi-value {
            display: block;
            font-size: 1.35rem;
            font-weight: 700;
            color: #1f2937;
        }

        .prestacao-document {
            max-width: 1080px;
            margin: 0 auto;
        }

        .prestacao-signature {
            display: none;
        }

        .prestacao-signature-line {
            margin-top: 3rem;
            border-top: 1px solid #6b7280;
            width: 320px;
            max-width: 100%;
        }

        .prestacao-filters {
            margin-bottom: 1rem;
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--financeiro-border);
            border-radius: 0.6rem;
            background: #fcfcfc;
        }

        .prestacao-report {
            background: #fff;
            border: 1px solid var(--financeiro-border);
            padding: 1.5rem 1.6rem;
        }

        .prestacao-report-header {
            margin-bottom: 1.4rem;
            padding-bottom: 0.9rem;
            border-bottom: 2px solid #d7dbe2;
        }

        .prestacao-report-title {
            margin: 0 0 0.45rem;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #17212d;
        }

        .prestacao-report-meta {
            margin: 0.18rem 0;
            color: #4b5563;
            font-size: 0.92rem;
        }

        .prestacao-section {
            margin-bottom: 1.2rem;
            padding-top: 0.2rem;
        }

        .prestacao-section-title {
            margin: 0 0 0.65rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #d7dbe2;
            font-size: 1rem;
            font-weight: 700;
            color: #223041;
        }

        .prestacao-summary-table {
            width: 100%;
            border-collapse: collapse;
        }

        .prestacao-summary-table td {
            padding: 0.42rem 0;
            border-bottom: 1px solid #eceff3;
            font-size: 0.96rem;
        }

        .prestacao-summary-table td:last-child {
            text-align: right;
            font-weight: 700;
            white-space: nowrap;
        }

        .prestacao-summary-table tr.is-total td {
            padding-top: 0.7rem;
            border-top: 2px solid #cfd5dd;
            border-bottom: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .prestacao-table {
            width: 100%;
        }

        .prestacao-table th:last-child,
        .prestacao-table td:last-child {
            text-align: right;
            white-space: nowrap;
        }

        .money-cell {
            display: inline-grid;
            grid-template-columns: 2.1ch minmax(0, 1fr);
            align-items: baseline;
            gap: 0.35rem;
            min-width: 12ch;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .money-symbol {
            text-align: left;
        }

        .money-number {
            text-align: right;
        }

        .extrato-text {
            background: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
        }

        .extrato-text.is-receita {
            color: var(--financeiro-receita);
        }

        .extrato-text.is-despesa {
            color: var(--financeiro-despesa);
        }

        .extrato-text.is-transferencia {
            color: var(--financeiro-transferencia);
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm;
            }

            html,
            body {
                background: #fff !important;
                color: var(--financeiro-print-text);
                font-size: 11px;
            }

            .navbar,
            .no-print,
            .filters-box,
            .button,
            .buttons,
            .notification {
                display: none !important;
            }

            .section {
                padding: 0.5rem 0;
            }

            .container {
                max-width: none !important;
                width: 100%;
                padding: 0 !important;
            }

            .level {
                display: block;
                margin-bottom: 0.75rem;
            }

            .title {
                font-size: 18px !important;
                margin-bottom: 0.35rem !important;
            }

            .subtitle,
            .table-caption,
            .financeiro-meta {
                color: #374151 !important;
                font-size: 10px !important;
            }

            .table-wrapper {
                overflow: visible;
            }

            .financeiro-table {
                width: 100%;
                font-size: 10px;
                table-layout: fixed;
            }

            .financeiro-table th,
            .financeiro-table td {
                padding: 0.3rem 0.35rem !important;
                color: #111 !important;
                background: #fff !important;
                border-color: #c7c7c7 !important;
            }

            .tipo-badge,
            .status-badge,
            .valor-chip,
            .extrato-text {
                padding: 0;
                background: transparent !important;
                color: #111 !important;
                box-shadow: none !important;
                border-radius: 0;
            }

            .financeiro-table thead {
                display: table-header-group;
            }

            .financeiro-table tr {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .financeiro-report-block,
            .financeiro-kpi {
                border-color: #c7c7c7 !important;
                box-shadow: none !important;
                break-inside: avoid;
                page-break-inside: avoid;
                margin-bottom: 0.6rem !important;
            }

            .financeiro-report-header {
                background: #fff !important;
                border-bottom-color: #c7c7c7 !important;
                padding: 0.45rem 0.6rem !important;
            }

            .financeiro-report-title {
                font-size: 12px !important;
                color: #111 !important;
            }

            .financeiro-report-body {
                padding: 0.55rem 0.6rem !important;
            }

            .financeiro-kpi-grid {
                gap: 0.45rem !important;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .financeiro-kpi {
                padding: 0.55rem 0.6rem !important;
            }

            .financeiro-kpi-label {
                font-size: 9px !important;
                color: #444 !important;
            }

            .financeiro-kpi-value {
                font-size: 13px !important;
                color: #111 !important;
            }

            .financeiro-total-line {
                padding-top: 0.4rem !important;
                margin-top: 0.4rem !important;
                border-top-color: #c7c7c7 !important;
                color: #111 !important;
            }

            .prestacao-document {
                max-width: none !important;
            }

            .prestacao-filters {
                display: none !important;
            }

            .prestacao-report {
                border-color: #c7c7c7 !important;
                padding: 0 !important;
                background: #fff !important;
            }

            .prestacao-report-header {
                margin-bottom: 0.75rem !important;
                padding-bottom: 0.45rem !important;
                border-bottom-color: #c7c7c7 !important;
            }

            .prestacao-report-title {
                font-size: 16px !important;
                color: #111 !important;
            }

            .prestacao-report-meta {
                font-size: 10px !important;
                color: #111 !important;
            }

            .prestacao-section {
                margin-bottom: 0.8rem !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .prestacao-section-title {
                font-size: 11px !important;
                color: #111 !important;
                border-bottom-color: #c7c7c7 !important;
                margin-bottom: 0.45rem !important;
            }

            .prestacao-summary-table td {
                font-size: 10px !important;
                padding: 0.22rem 0 !important;
                border-bottom-color: #d5d5d5 !important;
            }

            .money-cell {
                min-width: 12ch !important;
                gap: 0.25rem !important;
            }

            .prestacao-summary-table tr.is-total td {
                border-top-color: #c7c7c7 !important;
            }

            .prestacao-signature {
                display: block !important;
                margin-top: 1rem;
                padding-top: 0.3rem;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .prestacao-signature p {
                margin-bottom: 0.4rem !important;
                font-size: 10px !important;
                color: #111 !important;
            }

            .actions-cell {
                display: none !important;
            }
        }
    </style>
</head>
<body>
<nav class="navbar is-light" role="navigation" aria-label="main navigation">
    <div class="container">
        <div class="navbar-menu is-active">
            <div class="navbar-start">
                <a class="navbar-item" href="{% url 'financeiro:home' %}">Financeiro</a>
                <a class="navbar-item" href="{% url 'financeiro:resumo' %}">Resumo</a>
                <a class="navbar-item" href="{% url 'financeiro:prestacao-contas' %}">Prestacao de Contas</a>
                <a class="navbar-item" href="{% url 'financeiro:extrato-list' %}">Extratos</a>
                <a class="navbar-item" href="{% url 'financeiro:conta-list' %}">Contas</a>
                <a class="navbar-item" href="{% url 'financeiro:centro-custo-list' %}">Centros de Custo</a>
                <a class="navbar-item" href="{% url 'financeiro:pessoa-list' %}">Pessoas</a>
                <a class="navbar-item" href="{% url 'financeiro:categoria-list' %}">Categorias</a>
                <a class="navbar-item" href="{% url 'financeiro:lancamento-list' %}">Lancamentos</a>
            </div>
        </div>
    </div>
</nav>
<section class="section">
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="notification {% if message.tags == 'error' %}is-danger{% elif message.tags == 'warning' %}is-warning{% else %}is-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</section>
</body>
</html>
