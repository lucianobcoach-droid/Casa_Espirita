<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>
<nav class="navbar is-light" role="navigation" aria-label="main navigation">
    <div class="navbar-menu is-active">
        <div class="navbar-start">
            <a class="navbar-item" href="{% url 'biblioteca:autor-list' %}">Autores</a>
            <a class="navbar-item" href="{% url 'biblioteca:livro-list' %}">Livros</a>
            <a class="navbar-item" href="{% url 'biblioteca:venda-list' %}">Vendas</a>
            <a class="navbar-item" href="{% url 'biblioteca:emprestimo-list' %}">Empréstimos</a>
        </div>
    </div>
</nav>
<section class="section">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</section>
</body>
</html>
